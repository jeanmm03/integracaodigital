<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Integração de Visitantes</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: linear-gradient(to bottom, #f0f4f8, #e0e7ff);
  font-family: 'Inter', sans-serif;
}

.fade {
  transition: all 0.4s ease;
}

.custom-scroll::-webkit-scrollbar {
  width: 8px;
}

.custom-scroll::-webkit-scrollbar-track {
  background: #f3f4f6;
  border-radius: 999px;
}

.custom-scroll::-webkit-scrollbar-thumb {
  background: #cbd5e1;
  border-radius: 999px;
}

.custom-scroll::-webkit-scrollbar-thumb:hover {
  background: #94a3b8;
}

.hidden-step {
  opacity: 0;
  transform: translateX(20px);
  pointer-events: none;
  position: absolute;
  width: 100%;
}

.active-step {
  opacity: 1;
  transform: translateX(0);
  position: relative;
}

.texto-paragrafo {
  margin-bottom: 14px;
  line-height: 1.7;
}
</style>
</head>

<body class="flex items-center justify-center min-h-screen p-4">

<!-- 🌍 IDIOMA -->
<div id="modalIdioma" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50">
  <div class="bg-white p-8 rounded-2xl text-center space-y-3 w-full max-w-md shadow-2xl">

    <h2 class="text-xl font-bold">🌍 Idioma / Language</h2>

    <button onclick="setIdioma('pt')" class="w-full bg-yellow-400 hover:bg-yellow-500 transition p-3 rounded-xl font-semibold">
      Português
    </button>

    <button onclick="setIdioma('en')" class="w-full bg-gray-200 hover:bg-gray-300 transition p-3 rounded-xl font-semibold">
      English
    </button>

    <button onclick="setIdioma('es')" class="w-full bg-gray-200 hover:bg-gray-300 transition p-3 rounded-xl font-semibold">
      Español
    </button>

  </div>
</div>

<!-- 🔐 CADASTRO -->
<div id="modalCadastro" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4">

  <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md">

    <!-- 🏢 TÍTULO PRINCIPAL -->
    <div class="text-center mb-6 space-y-2">

      <h1 id="tituloPortal"
          class="text-1xl font-extrabold text-gray-800 tracking-wide">
      </h1>

      <h2 id="cadastroTitulo"
          class="text-xl font-semibold text-gray-700">
      </h2>

    </div>

    <div class="space-y-4">

      <input id="nome"
             class="w-full border p-3 rounded-xl" />

      <input id="empresa"
             class="w-full border p-3 rounded-xl" />

      <input id="dataVisita"
             type="date"
             readonly
             class="w-full border p-3 rounded-xl bg-gray-100 cursor-not-allowed" />

      <select id="unidade"
              class="w-full border p-3 rounded-xl">

        <option value="">Selecione...</option>

        <option>Osasco (Matriz)</option>
        <option>Sumaré (Filial)</option>
        <option>Pernambuco (Filial)</option>

      </select>

      <button id="btnIniciar"
              disabled
              class="w-full bg-yellow-400 hover:bg-yellow-500 transition p-3 rounded-xl font-semibold disabled:opacity-40">
      </button>

    </div>

  </div>

</div>

<!-- 📚 APP -->
<div id="conteudo"
  class="hidden bg-white p-8 rounded-2xl w-full max-w-4xl shadow-xl relative overflow-hidden">

  <!-- 🏢 TOPO -->
  <div class="flex justify-end mb-4">

    <img 
  src="https://cdn.jsdelivr.net/gh/jeanmm03/integracaodigital@main/logoDS.png"
  class="h-10 object-contain"
/>

  </div>

  <!-- progress -->
  <div class="w-full bg-gray-200 h-2 rounded mb-6">
    <div id="progress"
      class="bg-yellow-400 h-2 rounded transition-all duration-500"
      style="width:20%">
    </div>
  </div>

  <!-- STEPS -->
  <div class="relative min-h-[380px]">

    <!-- STEP 1 -->
    <div id="step1"
     class="fade active-step space-y-4 overflow-y-auto max-h-[340px] pr-3 scroll-smooth">

      <h2 id="t1titulo" class="text-2xl font-bold"></h2>

      <div id="t1p1"></div>

      <ul id="t1lista" class="space-y-2"></ul>

      <button id="btnNext"
        onclick="nextStep()"
        class="bg-yellow-400 hover:bg-yellow-500 transition px-5 py-3 rounded-xl font-semibold">
      </button>

    </div>

    <!-- STEP 2 -->
    <div id="step2" class="fade hidden-step space-y-4">

      <h2 id="t2titulo" class="text-2xl font-bold"></h2>

      <div id="t2p1"></div>

      <button id="btnNext2"
        onclick="nextStep()"
        class="bg-yellow-400 hover:bg-yellow-500 transition px-5 py-3 rounded-xl font-semibold">
      </button>

    </div>

    <!-- STEP 3 -->
    <div id="step3" class="fade hidden-step space-y-4">

      <h2 id="t3titulo" class="text-2xl font-bold"></h2>

      <div id="t3p1"></div>

      <button id="btnNext3"
        onclick="nextStep()"
        class="bg-yellow-400 hover:bg-yellow-500 transition px-5 py-3 rounded-xl font-semibold">
      </button>

    </div>

    <!-- STEP 4 -->
<div id="step4"
     class="fade hidden-step space-y-4 max-h-[60vh] overflow-y-auto pr-3 custom-scroll">

  <h2 id="t4titulo" class="text-2xl font-bold"></h2>

  <p id="t4p1" class="texto-paragrafo"></p>

  <ul id="t4lista" class="space-y-3"></ul>

  <p id="t4p2" class="font-medium text-gray-700"></p>

  <button id="btnNext4"
    onclick="nextStep()"
    class="bg-yellow-400 hover:bg-yellow-500 transition px-5 py-3 rounded-xl font-semibold">
  </button>

</div>

    <!-- STEP 5 -->
    <div id="step5" class="fade hidden-step text-center space-y-4">

      <h2 id="finalTitulo" class="text-2xl font-bold"></h2>

      <p id="finalMsg"></p>

      <div class="text-gray-600 text-sm mt-6 space-y-2">
        <p>📧 faleconosco@desantalog.com.br</p>
        <p>🌐 www.desantalog.com.br</p>
        <p>📱 @desantaTransporte</p>
      </div>

      <button id="btnRestart"
        onclick="voltarInicio()"
        class="mt-6 bg-gray-200 hover:bg-gray-300 px-5 py-3 rounded-xl transition font-semibold">
      </button>

    </div>

  </div>
</div>

<!-- ✍️ ASSINATURA -->
<div class="fixed bottom-2 w-full text-center text-xs text-gray-400">
  <span id="assinaturaTxt"></span>

  <a href="mailto:jean.marques@desantalog.com.br"
    class="underline hover:text-gray-600 transition">
    Jean Marques
  </a>
</div>

function renderParagrafos(elemento, lista){
  elemento.innerHTML = lista
    .map(texto => `<p class="texto-paragrafo">${texto}</p>`)
    .join("");
}

function renderLista(elemento, lista){
  elemento.innerHTML = lista
    .map(item => `<li>${item}</li>`)
    .join("");
}

function setIdioma(lang){

  idioma = lang;

  document.getElementById("modalIdioma").classList.add("hidden");

  document.getElementById("modalCadastro").classList.remove("hidden");

  aplicarIdioma();

  // 📅 Define automaticamente a data atual
  const hoje = new Date().toISOString().split('T')[0];
  document.getElementById("dataVisita").value = hoje;

  validar();
}

function aplicarIdioma(){

  const t = textos[idioma];

  tituloPortal.innerText = t.tituloPortal;

cadastroTitulo.innerText = t.cadastro;

  nome.placeholder = t.nome;

  empresa.placeholder = t.empresa;

  btnIniciar.innerText = t.iniciar;

  t1titulo.innerText = t.t1titulo;
  renderParagrafos(t1p1, t.t1p1);
  renderLista(t1lista, t.t1lista);

  t2titulo.innerText = t.t2titulo;
  renderParagrafos(t2p1, t.t2p1);

  t3titulo.innerText = t.t3titulo;
  renderParagrafos(t3p1, t.t3p1);

  t4titulo.innerText = t.t4titulo;
  t4p1.innerText = t.t4p1;
  renderLista(t4lista, t.t4lista);
  t4p2.innerText = t.t4p2;

  finalTitulo.innerText = t.finalTitulo;
  finalMsg.innerText = t.finalMsg;

  btnNext.innerText = t.btnContinuar;
  btnNext2.innerText = t.btnContinuar;
  btnNext3.innerText = t.btnContinuar;
  btnNext4.innerText = t.btnFinalizar;
  btnRestart.innerText = t.btnVoltar;

  assinaturaTxt.innerText = t.assinatura + " ";
}

function validar(){

  btnIniciar.disabled = !(
    nome.value &&
    empresa.value &&
    dataVisita.value &&
    unidade.value
  );
}

nome.oninput = validar;
empresa.oninput = validar;
dataVisita.onchange = validar;
unidade.onchange = validar;

btnIniciar.onclick = () => {

  modalCadastro.classList.add("hidden");
  conteudo.classList.remove("hidden");

  // garante topo do primeiro step
  setTimeout(() => {
    document.getElementById("step1").scrollTop = 0;
  }, 50);

};

function nextStep(){

  const atual = document.getElementById("step"+step);

  atual.classList.replace("active-step","hidden-step");

  atual.scrollTop = 0;

  step++;

  const prox = document.getElementById("step"+step);

  if(prox){

    prox.classList.replace("hidden-step","active-step");

    // força scroll no topo após renderizar
    setTimeout(() => {
      prox.scrollTop = 0;
    }, 50);

  }

  document.getElementById("progress").style.width = (step*20)+"%";
}

function voltarInicio(){

  document.getElementById("step" + step)
    .classList.replace("active-step", "hidden-step");

  step = 1;

  document.getElementById("step1")
    .classList.replace("hidden-step", "active-step");

  progress.style.width = "20%";

  nome.value = "";
  empresa.value = "";
  dataVisita.value = "";
  unidade.value = "";

  btnIniciar.disabled = true;

  conteudo.classList.add("hidden");

  modalIdioma.classList.remove("hidden");
}

window.onload = () => {
  assinaturaTxt.innerText = textos.pt.assinatura + " ";
};

</script>

</body>
</html>
